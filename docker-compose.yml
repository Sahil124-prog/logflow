services:
  api:
    build: .
    container_name: logflow-api
    restart: unless-stopped
    env_file: .env
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - logflow-net

  log-ingestion-service:
    build: ./log-ingestion-service
    container_name: logflow-log-ingestion-service
    restart: unless-stopped
    env_file: .env
    depends_on:
      mongodb:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - logflow-net
    environment:
      - PORT=5001
  alert-service:
    build: ./alert-service
    container_name: logflow-alert-service
    restart: unless-stopped
    env_file: .env
    depends_on:
      mongodb:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - logflow-net
  notification-service:
    build: ./notification-service
    container_name: logflow-notification-service
    restart: unless-stopped
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - logflow-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: logflow-rabbitmq
    restart: unless-stopped
    ports:
      - "15672:15672"   # management UI — http://localhost:15672 (guest/guest)
    networks:
      - logflow-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6
    container_name: logflow-mongodb
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - logflow-net

  redis:
    image: redis:7-alpine
    container_name: logflow-redis
    restart: unless-stopped
    networks:
      - logflow-net

  nginx:
    image: nginx:alpine
    container_name: logflow-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - logflow-net

  prometheus:
    image: prom/prometheus:latest
    container_name: logflow-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - logflow-net

  localstack:
    image: localstack/localstack:3.0.0
    container_name: logflow-localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,iam
      - DEFAULT_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
    networks:
      - logflow-net
    volumes:
      - localstack-data:/var/lib/localstack
    depends_on:
      - api

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: logflow-client
    networks:
      - logflow-net

  simulator:
    build:
      context: ./services
      dockerfile: Dockerfile
    container_name: logflow-simulator
    environment:
      - LOG_INGESTION_URL=http://log-ingestion-service:5001
    depends_on:
      - log-ingestion-service
    networks:
      - logflow-net

networks:
  logflow-net:
    driver: bridge

volumes:
  mongo-data:
  localstack-data:
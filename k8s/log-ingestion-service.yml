apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-ingestion-service
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: log-ingestion-service
  template:
    metadata:
      labels:
        app: log-ingestion-service
    spec:
      containers:
        - name: log-ingestion-service
          image: 866972254535.dkr.ecr.us-east-1.amazonaws.com/logflow-log-ingestion-service:29
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: logflow-config
            - secretRef:
                name: logflow-secrets   # JWT_SECRET, INGEST_API_KEY
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: log-ingestion-service
  namespace: default
spec:
  selector:
    app: log-ingestion-service
  ports:
    - port: 5000
      targetPort: 5000
# logflow-api only. Every other service has its own file in k8s/ —
# ONE definition per object, otherwise "kubectl apply -f k8s/" lets the
# alphabetically-later file silently overwrite this one.
# Image tag: Jenkins' Deploy stage runs "kubectl set image" with the build
# number; keep every service on the same tag when editing by hand.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logflow-api
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: logflow-api
  template:
    metadata:
      labels:
        app: logflow-api
    spec:
      containers:
        - name: logflow-api
          image: 866972254535.dkr.ecr.us-east-1.amazonaws.com/logflow-api:29
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: logflow-config
            - secretRef:
                name: logflow-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
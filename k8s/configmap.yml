apiVersion: v1
kind: ConfigMap
metadata:
  name: logflow-config
  namespace: default
data:
  LOG_RETENTION_DAYS: "30"
  PORT: "5000"
  NODE_ENV: "production"
  MONGO_URI: "mongodb://mongodb-service:27017/logflow"
  RABBITMQ_URL: "amqp://rabbitmq-service:5672"
  LOG_INGESTION_URL: "http://log-ingestion-service:5001"

  
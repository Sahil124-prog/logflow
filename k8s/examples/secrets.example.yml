# TEMPLATE ONLY — placeholder values, safe to commit.
# Lives in k8s/examples/ on purpose: "kubectl apply -f k8s/" is NOT recursive,
# so these CHANGE_ME values can never overwrite the real Secret by accident.
#
# Real values NEVER go in Git. To create the Secret on a cluster:
#
#   kubectl create secret generic logflow-secrets `
#     --from-literal=JWT_SECRET="<long random string>" `
#     --from-literal=INGEST_API_KEY="<long random string>" `
#     --from-literal=DEPLOY_KEY="<long random string>" `
#     --from-literal=AWS_ACCESS_KEY_ID="<key id>" `
#     --from-literal=AWS_SECRET_ACCESS_KEY="<secret>" `
#     --from-literal=LAMBDA_AWS_ACCESS_KEY_ID="<key id>" `
#     --from-literal=LAMBDA_AWS_SECRET_ACCESS_KEY="<secret>"
#
# Check which keys exist (names + sizes only, never values):
#   kubectl describe secret logflow-secrets
#
# Who reads what:
#   JWT_SECRET                 api, log-ingestion-service
#   INGEST_API_KEY             log-ingestion-service (checks it), simulator (sends it)
#   DEPLOY_KEY                 api (/api/deploys webhook from Jenkins)
#   AWS_ACCESS_KEY_ID/SECRET   api (S3 export)
#   LAMBDA_AWS_*               alert-service (Lambda invoke for critical logs)
apiVersion: v1
kind: Secret
metadata:
  name: logflow-secrets
  namespace: default
type: Opaque
stringData:
  JWT_SECRET: "CHANGE_ME"
  INGEST_API_KEY: "CHANGE_ME"
  DEPLOY_KEY: "CHANGE_ME"
  AWS_ACCESS_KEY_ID: "CHANGE_ME"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME"
  LAMBDA_AWS_ACCESS_KEY_ID: "CHANGE_ME"
  LAMBDA_AWS_SECRET_ACCESS_KEY: "CHANGE_ME"
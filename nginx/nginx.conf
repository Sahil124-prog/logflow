events {
  worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;   # Docker's internal DNS, re-checked every 10s

  upstream api {
    zone api_zone 64k;
    server api:5000 resolve;
  }

  upstream log-ingestion {
    zone ingestion_zone 64k;
    server log-ingestion-service:5001 resolve;
  }

  upstream client {
    zone client_zone 64k;
    server client:80 resolve;
  }

  server {
    listen 80;

      location = /api/logs {
      if ($request_method = POST) {
        rewrite ^ / break;
        proxy_pass http://log-ingestion;
      }
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/logs/cleanup {
      proxy_pass http://log-ingestion/cleanup;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /metrics {
      deny all;    # internal only: Prometheus scrapes api:5000 directly
    }


    location /socket.io/ {
      proxy_pass http://api;
      
      
      proxy_http_version 1.1; 
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass http://client;
      proxy_set_header Host $host;
    }

    location /health {
      proxy_pass http://api;
      proxy_set_header Host $host;
    }

    location = /ready {
      proxy_pass http://api;
      proxy_set_header Host $host;
    }
  }
}
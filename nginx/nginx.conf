events {
  worker_connections 1024;
}

http {
  upstream api {
    server api:5000;
  }

  upstream log-ingestion {
    server log-ingestion-service:5001;
  }

  upstream client {
    server client:80;
  }

  server {
    listen 80;

    location = /api/logs {
      if ($request_method = POST) {
        proxy_pass http://log-ingestion;
        break;
      }
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/logs/cleanup {
      proxy_pass http://log-ingestion;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /metrics {
      proxy_pass http://api;
    }

    location /socket.io/ {
      proxy_pass http://api;
      
      
      proxy_http_version 1.1; 
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass http://client;
      proxy_set_header Host $host;
    }

    location /health {
      proxy_pass http://api;
      proxy_set_header Host $host;
    }
  }
}